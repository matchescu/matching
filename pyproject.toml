[tool.poetry]
name = "matchescu-matching"
version = "0.23.9"
description = "Common types and algorithms used for matching two information"
authors = ["Andrei Olar <andrei.olar@ubbcluj.ro>"]
license = "MIT"
readme = "README.md"
packages = [{include = "matchescu", from="src"}]

[tool.poetry.scripts]
train-matcher = "matchescu.matching.matchers.ml.training.__main__:run_training"

[tool.poetry.dependencies]
python = "!=3.14.1,~3.13"
polars = "^1.44.1"
scikit-learn = "^1.9.0"
numpy = "^2.5.2"
jellyfish = "^1.2.1"
stopwords = "^1.0.2"
transformers = "^5.1.0"
datasketch = "^1.10.0"
torch = "^2.10.0"
pyarrow = "^23.0.0"
tiktoken = "^0.12.0"
sentencepiece = "^0.2.1"
rapidfuzz = "^3.14.5"
pydantic = "^2.13.4"
matchescu-base = "^0.27.7"
matchescu-reference-store = "^0.9.9"
matchescu-reference-extraction = "^0.9.11"
matchescu-comparison-space-generation = "^0.8.9"

[tool.poetry.group.dev.dependencies]
notebook = "^7.2.2"
pytest = "^8.4.2"
plotly = "^6.9.0"
black = {version = "^25.12.0", extras = ["jupyter"]}
tensorboard = "^2.21.0"
ruff = "^0.16.5"
mypy = "^1.20.2"
pyresolvemetrics = "^0.3.5"
humanize = "^4.12.2"
click = "^8.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
